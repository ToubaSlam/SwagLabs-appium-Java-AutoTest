# Common config shared by all platforms/environments.
# Override any value with a matching -D system property, e.g.
# mvn test -Dappium.url=http://127.0.0.1:4723

appium.url=http://127.0.0.1:4723
implicit.wait.seconds=10
explicit.wait.seconds=20
new.command.timeout.seconds=240

# android | ios - which properties file DriverManager loads on top of this one.
platform=android
